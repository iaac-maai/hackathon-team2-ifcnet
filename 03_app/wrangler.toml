# Cloudflare Pages project: the page (public/) + the API (functions/) + D1 database
# (R2 is not used: Cloudflare asks for a payment method to enable it)
name = "hackathon-ifc-app"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Plain settings, readable by the functions as env.MODEL_URL
[vars]
# Our model server on Render, without a slash at the end
MODEL_URL = "https://hackathon-team2-ifcnet.onrender.com"
# "analyse": takes the .ifc file as base64 text, returns score, threshold, unusual (+ embedding, not stored)
MODEL_API_NAME = "analyse"

# The database (created with `npx wrangler d1 create hackathon-ifc-db`)
[[d1_databases]]
binding = "DB"
database_name = "hackathon-ifc-db"
database_id = "4d4d43a6-66f2-4e2e-bfb9-14c56dbc53d0"

# The password is NOT here: it is a secret.
# Local:   put APP_PASSWORD=... in a .dev.vars file (never commit it)
# Online:  npx wrangler pages secret put APP_PASSWORD
