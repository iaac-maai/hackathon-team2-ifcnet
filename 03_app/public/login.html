<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · IFC Check</title>
  <!-- Self-contained: before login only /login, /login.html, /api/login and /style.css are served by our app.
       Fonts (Google) and three.js (jsdelivr) come from other origins, so they are not blocked. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <style>
    :root {
      --bg: #EEF0EC; --surface: #FFFFFF; --surface-2: #F4F5F2;
      --sage: #6F8A7A; --sage-deep: #3E5A49; --forest: #2B4234;
      --ink: #1F2A24; --muted: #6B746E; --line: #DCE1DB;
      --mustard: #C9932F; --rust: #B5562E;
      --head: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px;
    }
    .shell {
      width: min(1100px, 100%); min-height: min(640px, calc(100vh - 48px));
      display: grid; grid-template-columns: 1.1fr 1fr;
      background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 10px;
      box-shadow: 0 1px 2px rgba(43, 66, 52, .05), 0 30px 60px -28px rgba(43, 66, 52, .35);
    }
    .visual {
      position: relative; overflow: hidden; border-radius: 22px; min-height: 420px;
      background:
        radial-gradient(70% 60% at 30% 25%, rgba(255, 255, 255, .18), transparent 65%),
        linear-gradient(150deg, var(--sage) 0%, var(--sage-deep) 100%);
    }
    .visual canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .visual .label { position: absolute; left: 22px; bottom: 20px; color: rgba(255, 255, 255, .75); }
    .visual .dots { position: absolute; left: 22px; top: 22px; display: flex; gap: 6px; }
    .visual .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
    .visual .dots i:nth-child(2) { background: var(--mustard); }
    .label { font: 600 11px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    .side { display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(28px, 5vw, 64px); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
    .brand-mark { position: relative; width: 24px; height: 24px; }
    .brand-mark i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--sage-deep); }
    .brand-mark i:nth-child(1) { left: 0; top: 2px; }
    .brand-mark i:nth-child(2) { right: 0; top: 8px; background: var(--mustard); }
    .brand-mark i:nth-child(3) { left: 8px; bottom: 0; }
    .brand-name { font: 700 20px/1 var(--head); letter-spacing: -.02em; }
    h1 { margin: 0; font: 700 clamp(30px, 3vw, 38px)/1.1 var(--head); letter-spacing: -.03em; }
    .lead { margin: 10px 0 30px; color: var(--muted); font-size: 14.5px; }
    form { display: flex; flex-direction: column; gap: 8px; }
    label { font: 600 13px/1.3 var(--sans); color: var(--ink); }
    input[type="password"] {
      width: 100%; padding: 13px 14px; font: 400 15px/1.2 var(--sans); color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input[type="password"]:focus { outline: none; background: #fff; border-color: var(--sage); box-shadow: 0 0 0 4px rgba(62, 90, 73, .14); }
    button {
      margin-top: 10px; width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer;
      background: var(--sage-deep); color: #fff; font: 600 15px/1 var(--sans);
      box-shadow: 0 10px 20px -12px rgba(43, 66, 52, .7);
      transition: background .2s, transform .2s;
    }
    button:hover { background: var(--forest); transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
    .error {
      margin: 14px 0 0; padding: 10px 12px; border-radius: 12px;
      color: var(--rust); background: rgba(181, 86, 46, .08); font-size: 14px;
    }
    .error[hidden] { display: none; }
    .fine { margin: 26px 0 0; color: var(--muted); font-size: 12.5px; }

    @media (max-width: 820px) {
      body { padding: 12px; place-items: start center; }
      .shell { grid-template-columns: 1fr; min-height: 0; }
      .visual { min-height: 0; height: 190px; }
      .side { padding: 32px 18px 28px; }
      .brand { margin-bottom: 26px; }
    }
  </style>
  <!-- Cloudflare Web Analytics: cookieless page views (see /privacy). The token is public, not a secret. -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f11646e0d49148caaab507023e0e8ef2"}'></script>
</head>
<body>
  <div class="shell">
    <div class="visual" id="visual" aria-hidden="true">
      <div class="dots"><i></i><i></i><i></i></div>
      <span class="label">IFC elements as point clouds</span>
    </div>

    <div class="side">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">IFC Check</span>
      </div>
      <h1>Welcome back</h1>
      <p class="lead">Graph autoencoder for BIM element review · IAAC MaAI Team 2</p>
      <form method="post" action="/api/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>
      <p id="wrong" class="error" hidden>Wrong password. Try again.</p>
      <p class="fine">Team password · personal IAAC login (Cloudflare Access) is planned.</p>
    </div>
  </div>

  <script>
    if (new URLSearchParams(location.search).has("wrong")) {
      document.getElementById("wrong").hidden = false;
    }
  </script>

  <script type="module">
    // Decoration only: a procedural building made of points (generated here, not real data).
    import * as THREE from "three";

    const box = document.getElementById("visual");
    const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rand = (a, b) => a + Math.random() * (b - a);

    // ---- building geometry (z up): 2.8 x 1.5 footprint, 3 storeys of 0.48
    const W = 1.4, D = 0.75, H = 0.48, FLOORS = 3, TOP = H * FLOORS;
    const pts = [];
    const add = (x, y, z) => pts.push(x, y, z);
    const per = (a, b, n, z) => { for (let i = 0; i < n; i++) { const t = i / n; add(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, z); } };
    const outline = (z, k) => { per([-W, -D], [W, -D], 70 * k, z); per([W, -D], [W, D], 38 * k, z); per([W, D], [-W, D], 70 * k, z); per([-W, D], [-W, -D], 38 * k, z); };
    for (let f = 0; f <= FLOORS; f++) {                       // floor slabs: crisp edges + a light fill
      outline(f * H, 1); outline(f * H - 0.035, 0.6);
      for (let i = 0; i < 110; i++) add(rand(-W, W), rand(-D, D), f * H + rand(-0.01, 0.01));
    }
    for (const x of [-W, -W / 2, 0, W / 2, W]) for (const y of [-D, D]) {   // columns
      for (let i = 0; i < 30; i++) add(x, y, (i / 29) * TOP);
    }
    for (let f = 0; f < FLOORS; f++) {                        // facade mullions (front and back)
      for (let m = 1; m < 16; m++) {
        if (m % 4 === 0) continue;                            // columns stand there
        const x = -W + (m / 16) * 2 * W;
        for (let k = 1; k < 8; k++) add(x, -D, f * H + (k / 8) * H);
      }
    }
    for (let f = 0; f < FLOORS; f++) {                        // stair: 10 steps per storey, switch-back
      for (let s = 0; s < 10; s++) {
        const goingUp = s / 10, z = f * H + goingUp * H;
        const y = f % 2 ? D * 0.7 - goingUp * D * 1.3 : -D * 0.6 + goingUp * D * 1.3;
        for (let k = 0; k < 7; k++) add(W * 0.58 + (k / 6) * W * 0.3, y, z);
      }
    }
    for (const z of [TOP + 0.1, TOP + 0.05]) outline(z, 0.8); // roof edge / parapet
    const n = pts.length / 3;
    const target = new Float32Array(pts);
    for (let i = 0; i < n; i++) target[i * 3 + 2] -= TOP / 2;  // centre the building on the origin
    const start = new Float32Array(n * 3), delay = new Float32Array(n), tone = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const u = rand(-1, 1), th = rand(0, Math.PI * 2), r = rand(2.2, 4.2), q = Math.sqrt(1 - u * u);
      start[i * 3] = r * q * Math.cos(th); start[i * 3 + 1] = r * q * Math.sin(th); start[i * 3 + 2] = r * u;
      delay[i] = ((target[i * 3 + 2] + TOP / 2) / TOP) * 0.8 + rand(0, 0.3);   // lower points arrive first
      tone[i] = Math.random();
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(target, 3));
    geo.setAttribute("aStart", new THREE.BufferAttribute(start, 3));
    geo.setAttribute("aDelay", new THREE.BufferAttribute(delay, 1));
    geo.setAttribute("aTone", new THREE.BufferAttribute(tone, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uT: { value: REDUCED ? 99 : 0 }, uScale: { value: 400 }, uScan: { value: -9 } },
      vertexShader: `
        attribute vec3 aStart; attribute float aDelay; attribute float aTone;
        uniform float uT; uniform float uScale; uniform float uScan;
        varying float vScan; varying float vTone; varying float vFade;
        void main() {
          float p = clamp((uT - aDelay) / 1.4, 0.0, 1.0);
          p = p < 0.5 ? 4.0 * p * p * p : 1.0 - pow(-2.0 * p + 2.0, 3.0) / 2.0;
          vec3 pos = mix(aStart, position, p);
          vec4 world = modelMatrix * vec4(pos, 1.0);
          vScan = (1.0 - smoothstep(0.0, 0.09, abs(world.z - uScan))) * p;
          vTone = aTone;
          vec4 mv = viewMatrix * world;
          gl_Position = projectionMatrix * mv;
          vFade = 1.0 - 0.45 * smoothstep(4.2, 6.2, -mv.z);
          gl_PointSize = (0.024 + 0.02 * vScan) * uScale / -mv.z;
        }`,
      fragmentShader: `
        varying float vScan; varying float vTone; varying float vFade;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;
          if (d > 1.0) discard;
          float a = (1.0 - smoothstep(0.45, 0.75, d)) * vFade;
          vec3 cream = mix(vec3(1.0), vec3(0.96, 0.93, 0.85), vTone);
          vec3 c = mix(cream, vec3(0.79, 0.58, 0.18), vScan);
          gl_FragColor = vec4(c, a * (0.88 + 0.12 * vScan));
        }`,
    });

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) { console.warn("WebGL unavailable; the login form still works.", e); }
    if (renderer) {
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      box.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      const building = new THREE.Points(geo, mat);
      building.frustumCulled = false;
      const group = new THREE.Group();
      group.add(building);
      group.rotation.z = -0.55;
      scene.add(group);
      // Soft mustard scan ring around the footprint
      const ringGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-W - .12, -D - .12, 0), new THREE.Vector3(W + .12, -D - .12, 0),
        new THREE.Vector3(W + .12, D + .12, 0), new THREE.Vector3(-W - .12, D + .12, 0)]);
      const ring = new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ color: 0xC9932F, transparent: true, opacity: 0 }));
      group.add(ring);

      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
      camera.up.set(0, 0, 1);
      camera.position.set(3.3, -3.9, 2.9);
      camera.lookAt(0, 0, -0.05);

      function resize() {
        const w = box.clientWidth, h = box.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        // keep the whole building in view on narrow or short panels
        const fitH = h < 260 ? 1.15 : 1;
        camera.fov = Math.min(70, 34 * Math.max(1, 1.15 / camera.aspect) * fitH);
        camera.updateProjectionMatrix();
        mat.uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      }
      new ResizeObserver(() => { resize(); if (REDUCED) renderer.render(scene, camera); }).observe(box);
      resize();

      let t = REDUCED ? 99 : 0, raf = 0, last = 0;
      const SCAN_EVERY = 4.5, SCAN_TIME = 2.2, FLY = 2.5;
      function frame(now) {
        raf = requestAnimationFrame(frame);
        const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
        last = now;
        t += dt;
        mat.uniforms.uT.value = t;
        group.rotation.z += dt * 0.12;
        const s = t - FLY;                                  // scan line after the fly-in
        const phase = s > 0 ? s % SCAN_EVERY : -1;
        if (phase >= 0 && phase < SCAN_TIME) {
          const z = -TOP / 2 - 0.1 + (phase / SCAN_TIME) * (TOP + 0.3);
          mat.uniforms.uScan.value = z;
          ring.position.z = z;
          ring.material.opacity = 0.75 * Math.sin(Math.PI * phase / SCAN_TIME);
        } else {
          mat.uniforms.uScan.value = -9;
          ring.material.opacity = 0;
        }
        renderer.render(scene, camera);
      }
      if (REDUCED) {
        renderer.render(scene, camera);                     // static building, no motion
      } else {
        const go = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };
        const stop = () => { cancelAnimationFrame(raf); raf = 0; };
        document.addEventListener("visibilitychange", () => (document.hidden ? stop() : go()));
        if (!document.hidden) go();
      }
    }
  </script>
</body>
</html>
